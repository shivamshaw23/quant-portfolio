version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quant-postgres
    environment:
      POSTGRES_DB: quant_db
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quant_network

  redis:
    image: redis:7-alpine
    container_name: quant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quant_network

  # Optional: Kafka for event streaming
  # kafka:
  #   image: confluentinc/cp-kafka:latest
  #   container_name: quant-kafka
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #   ports:
  #     - "9092:9092"
  #   networks:
  #     - quant_network
  #   depends_on:
  #     - zookeeper

  # zookeeper:
  #   image: confluentinc/cp-zookeeper:latest
  #   container_name: quant-zookeeper
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #   ports:
  #     - "2181:2181"
  #   networks:
  #     - quant_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-worker
    environment:
      DATABASE_URL: postgresql://quant_user:quant_password@postgres:5432/quant_db
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - quant_network
    volumes:
      - ./:/app

volumes:
  postgres_data:
  redis_data:

networks:
  quant_network:
    driver: bridge
